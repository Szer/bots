# Read by scripts/check-comment-ratio.sh. Lang keys: tokei label, uppercased,
# '#'->SHARP, non-alnum->'_' (F# -> FSHARP). Aggressive ratio per user request.
DEFAULT_RATIO=0.05
DEFAULT_FLOOR=5

RATIO_SQL=0.30
FLOOR_SQL=5

RATIO_YAML=0.30
FLOOR_YAML=5

# No real comment-ratio signal for these — skip entirely.
IGNORE_LANGUAGES="MARKDOWN JSON PLAIN_TEXT"

# Comment-block length cap (independent rule, extension-driven, see script).
# 0 disables; BLOCK_<KEY> overrides per language (e.g. BLOCK_SQL=4).
MAX_COMMENT_BLOCK=2
