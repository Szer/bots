# comment-ratio-gate config — read by scripts/check-comment-ratio.sh.
# Language keys: tokei's label, uppercased, '#'->SHARP, non-alnum runs->'_'
# (e.g. F# -> FSHARP, C Header -> C_HEADER). Unset RATIO_/FLOOR_<LANG> falls
# back to DEFAULT_RATIO/DEFAULT_FLOOR (overridable via COMMENT_RATIO_MAX /
# COMMENT_RATIO_MIN_LINES env vars).
DEFAULT_RATIO=0.15
DEFAULT_FLOOR=5

RATIO_SQL=0.30
FLOOR_SQL=5

RATIO_YAML=0.30
FLOOR_YAML=5

# No real comment-ratio signal for these — skip entirely.
IGNORE_LANGUAGES="MARKDOWN JSON PLAIN_TEXT"
