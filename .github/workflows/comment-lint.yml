name: "Lint: Comment ratio"

on:
  pull_request:

permissions:
  contents: read

jobs:
  comment-ratio:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch base ref
      run: git fetch origin "${{ github.base_ref }}"

    - name: Check comment ratio
      env:
        EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'comment-ratio-exempt') }}
      run: |
        if [ "$EXEMPT" = "true" ]; then
          echo "::warning::comment-ratio-gate SKIPPED — 'comment-ratio-exempt' label present on this PR"
          exit 0
        fi
        scripts/check-comment-ratio.sh --range "origin/${{ github.base_ref }}...HEAD"
