name: Weekly Project Assessment

# Repo-wide, weekly sweep of the repo checkout + GitHub issues API (see
# AGENT-FLOWS-REDESIGN.md §3/§6.3). Posts to the log issue only when it acted.

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  project:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Ensure bot:<name> labels exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        source scripts/gather/lib.sh
        for bot in $(bots_yml_json | jq -r '.bots | keys[]'); do
          gh label create "bot:${bot}" --repo "${{ github.repository }}" --color "1d76db" \
            --description "Findings for the ${bot} bot" --force
        done

    - name: Ensure project agent log issue
      id: log-issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        EXISTING=$(gh issue list --repo "${{ github.repository }}" --label "project" --state open \
          --json number,title --jq '.[] | select(.title == "Project agent log") | .number' | head -n1)
        if [ -n "$EXISTING" ]; then
          echo "Reusing existing log issue #${EXISTING}"
          echo "issue_number=${EXISTING}" >> "$GITHUB_OUTPUT"
        else
          {
            echo "The project agent posts a run summary here only on runs where it created,"
            echo "updated, or closed a finding. Clean runs are visible only in that run's"
            echo "GitHub Actions step summary. Workflow: \`.github/workflows/project.yml\`."
          } > /tmp/log-issue-body.md
          ISSUE_URL=$(gh issue create --repo "${{ github.repository }}" \
            --title "Project agent log" --label "project" --body-file /tmp/log-issue-body.md)
          NEW=$(echo "$ISSUE_URL" | grep -Eo '[0-9]+$')
          echo "Created log issue #${NEW}"
          echo "issue_number=${NEW}" >> "$GITHUB_OUTPUT"
          gh issue pin "$NEW" --repo "${{ github.repository }}" || true
        fi

    - name: Prepare agent output dir and PATH
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.agent-out"
        echo "$GITHUB_WORKSPACE/scripts/agent-shim" >> "$GITHUB_PATH"

    - name: Self-test — gh resolves to the shim
      run: |
        set -euo pipefail
        RESOLVED=$(command -v gh)
        if [ "$RESOLVED" != "$GITHUB_WORKSPACE/scripts/agent-shim/gh" ]; then
          echo "::error::gh resolved to ${RESOLVED}, not the project-agent shim — refusing to run the agent unenforced."
          exit 1
        fi
        echo "gh resolves to the shim: ${RESOLVED}"

    - name: Load agent prompt
      run: |
        {
          PROMPT_DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
          echo "AGENT_PROMPT<<${PROMPT_DELIM}"
          cat .github/prompts/project.md
          echo "${PROMPT_DELIM}"
        } >> "$GITHUB_ENV"

    - name: Run project agent
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        responses-api-endpoint: ${{ secrets.AZURE_OPENAI_BASE_URL }}
        model: gpt-5-mini
        sandbox: workspace-write
        safety-strategy: drop-sudo
        effort: medium
        codex-home: ${{ github.workspace }}/.github/codex
        prompt: |
          <instructions>
          ${{ env.AGENT_PROMPT }}
          </instructions>

          You have been triggered for the weekly project assessment — repo-wide, covering every bot in `.github/bots.yml` (VahterBanBot, CouponHubBot, AlitaBot).
          When a finding is specific to one bot's source directory, add its `bot:<name>` label (e.g. `bot:vahter`) in addition to `project`. Shared-infra findings (BotInfra, tests, CI) need no bot label.
          The long-lived log issue is #${{ steps.log-issue.outputs.issue_number }} ($AGENT_LOG_ISSUE) — never comment on or close it, the workflow posts there. Write your summary to $AGENT_SUMMARY_FILE as your final action. A `gh` command refused by the shim must not be retried — note it in the summary and move on.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        AGENT_SUMMARY_FILE: ${{ github.workspace }}/.agent-out/summary.md
        AGENT_ACTIONS_LOG: ${{ github.workspace }}/.agent-out/actions.log
        AGENT_LOG_ISSUE: ${{ steps.log-issue.outputs.issue_number }}
        AGENT_COMMENT_THROTTLE_DAYS: 14

    - name: Assert agent wrote summary
      id: assert-agent-output
      if: always()
      env:
        SUMMARY_FILE: ${{ github.workspace }}/.agent-out/summary.md
        ACTIONS_LOG: ${{ github.workspace }}/.agent-out/actions.log
      run: |
        set -euo pipefail
        if [ -s "$SUMMARY_FILE" ]; then
          echo "agent_posted=true" >> "$GITHUB_OUTPUT"
        else
          echo "agent_posted=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -s "$ACTIONS_LOG" ]; then
          echo "shim_reached=true" >> "$GITHUB_OUTPUT"
        else
          echo "shim_reached=false" >> "$GITHUB_OUTPUT"
          echo "::error::actions log is empty — the gh shim was never invoked inside the sandbox this run; treat as a failure, never as a clean day."
        fi

    - name: Publish step summary
      if: always()
      env:
        SUMMARY_FILE: ${{ github.workspace }}/.agent-out/summary.md
        ACTIONS_LOG: ${{ github.workspace }}/.agent-out/actions.log
      run: |
        {
          echo "## Project agent summary"
          if [ -s "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE"
          else
            echo "Agent produced no summary."
          fi
          echo
          echo "## gh shim actions log"
          echo '```'
          if [ -s "$ACTIONS_LOG" ]; then
            cat "$ACTIONS_LOG"
          else
            echo "(empty — shim was never invoked)"
          fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Post to log issue when actions were taken
      if: always() && steps.assert-agent-output.outputs.agent_posted == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTIONS_LOG: ${{ github.workspace }}/.agent-out/actions.log
        SUMMARY_FILE: ${{ github.workspace }}/.agent-out/summary.md
        LOG_ISSUE: ${{ steps.log-issue.outputs.issue_number }}
      run: |
        set -euo pipefail
        if ! grep -q '^ALLOWED ' "$ACTIONS_LOG" 2>/dev/null; then
          echo "No ALLOWED actions this run — nothing to post."
          exit 0
        fi
        {
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          cat "$SUMMARY_FILE"
        } > /tmp/log-comment.md
        gh issue comment "$LOG_ISSUE" --repo "${{ github.repository }}" --body-file /tmp/log-comment.md

    # Guards run 30241204433 (2026-07-27): a step exiting 0 with no summary
    # is a silent no-op, not a clean day — must fail, not look green.
    - name: Fail run if agent produced no summary or shim not reached
      if: always()
      env:
        AGENT_POSTED: ${{ steps.assert-agent-output.outputs.agent_posted }}
        SHIM_REACHED: ${{ steps.assert-agent-output.outputs.shim_reached }}
      run: |
        set -euo pipefail
        if [ "$AGENT_POSTED" != "true" ]; then
          echo "::error::Project agent produced no summary file this run."
          exit 1
        fi
        if [ "$SHIM_REACHED" != "true" ]; then
          echo "::error::gh shim actions log is empty -- shim never invoked inside the sandbox."
          exit 1
        fi
        echo "Agent posted a summary and the shim was reached -- run considered successful."
