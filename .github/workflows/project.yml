name: Daily Project Assessment

# Repo-wide, ONE invocation per run (not looped per bot — see
# AGENT-FLOWS-REDESIGN.md §3/§6.3). No VPN/live-metrics gather anymore:
# project.md dropped all runtime signals (memory thresholds, log-volume
# threshold, 5xx, Loki queries, pod-health summary) per §6.3/§9 — that
# responsibility moves to the future `monitor` role (Phase 2), which is the
# one that will still need the aks-vpn concurrency group. The project agent
# now works purely from the repo checkout + the GitHub issues API.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Close stale orchestration issues
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue list --repo "${{ github.repository }}" --label "project" --state open \
          --json number,title \
          --jq '.[] | select(.title | test("project assessment \\d{4}-\\d{2}-\\d{2}"; "i")) | .number' \
        | while read -r NUM; do
          echo "Closing stale orchestration issue #${NUM}"
          gh issue close "$NUM" --repo "${{ github.repository }}" \
            --comment "**Auto-closed by cleanup.** Agent did not close this issue in time." \
            || echo "WARNING: Failed to close orchestration issue #${NUM}, continuing"
        done

  project:
    needs: cleanup
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Ensure bot:<name> labels exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        source scripts/gather/lib.sh
        for bot in $(bots_yml_json | jq -r '.bots | keys[]'); do
          gh label create "bot:${bot}" --repo "${{ github.repository }}" --color "1d76db" \
            --description "Findings for the ${bot} bot" --force
        done

    - name: Create orchestration issue
      id: create-issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        DATE=$(date -u +%Y-%m-%d)

        ISSUE_URL=$(gh issue create --repo "${{ github.repository }}" \
          --title "Daily project assessment ${DATE}" \
          --label "project" \
          --body "## Daily Project Assessment — ${DATE}

        **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        Repo-wide tech-debt / stale-doc / config-drift sweep. No runtime
        metrics snapshot in this role anymore — see
        \`.github/AGENT-FLOWS-REDESIGN.md\` §6.3; runtime anomaly detection
        is the future \`monitor\` role's job (Phase 2, not yet built).")

        ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -Eo '[0-9]+$')
        if [ -z "$ISSUE_NUMBER" ]; then
          echo "ERROR: Failed to parse issue number from: $ISSUE_URL"
          exit 1
        fi
        echo "Created issue #${ISSUE_NUMBER}"
        echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Load agent prompt
      run: |
        {
          PROMPT_DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
          echo "AGENT_PROMPT<<${PROMPT_DELIM}"
          cat .github/prompts/project.md
          echo "${PROMPT_DELIM}"
        } >> "$GITHUB_ENV"

    - name: Run project agent
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        responses-api-endpoint: ${{ secrets.AZURE_OPENAI_BASE_URL }}
        model: gpt-5-mini
        sandbox: workspace-write
        safety-strategy: drop-sudo
        effort: low
        codex-args: '--config sandbox_workspace_write.network_access=true'
        prompt: |
          <instructions>
          ${{ env.AGENT_PROMPT }}
          </instructions>

          You have been triggered for the daily project assessment — repo-wide, covering every bot in `.github/bots.yml` (VahterBanBot, CouponHubBot, AlitaBot).
          When a finding is specific to one bot's source directory, add its `bot:<name>` label (e.g. `bot:vahter`) in addition to `project`. Shared-infra findings (BotInfra, tests, CI) need no bot label.
          The orchestration issue is #${{ steps.create-issue.outputs.issue_number }}.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Close orchestration issue
      if: always() && steps.create-issue.outputs.issue_number
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue close "${{ steps.create-issue.outputs.issue_number }}" --repo "${{ github.repository }}" \
          --comment "Orchestration issue auto-closed after agent run. See workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
