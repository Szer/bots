name: Daily Project Assessment

# Repo-wide, ONE invocation per run (not looped per bot — see
# AGENT-FLOWS-REDESIGN.md §3/§6.3). No VPN/live-metrics gather anymore:
# project.md dropped all runtime signals (memory thresholds, log-volume
# threshold, 5xx, Loki queries, pod-health summary) per §6.3/§9 — that
# responsibility moves to the future `monitor` role (Phase 2), which is the
# one that will still need the aks-vpn concurrency group. The project agent
# now works purely from the repo checkout + the GitHub issues API.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Close stale orchestration issues
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue list --repo "${{ github.repository }}" --label "project" --state open \
          --json number,title \
          --jq '.[] | select(.title | test("project assessment \\d{4}-\\d{2}-\\d{2}"; "i")) | .number' \
        | while read -r NUM; do
          echo "Closing stale orchestration issue #${NUM}"
          gh issue close "$NUM" --repo "${{ github.repository }}" \
            --comment "**Auto-closed by cleanup.** Agent did not close this issue in time." \
            || echo "WARNING: Failed to close orchestration issue #${NUM}, continuing"
        done

  project:
    needs: cleanup
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Ensure bot:<name> labels exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        source scripts/gather/lib.sh
        for bot in $(bots_yml_json | jq -r '.bots | keys[]'); do
          gh label create "bot:${bot}" --repo "${{ github.repository }}" --color "1d76db" \
            --description "Findings for the ${bot} bot" --force
        done

    - name: Create orchestration issue
      id: create-issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        DATE=$(date -u +%Y-%m-%d)

        ISSUE_URL=$(gh issue create --repo "${{ github.repository }}" \
          --title "Daily project assessment ${DATE}" \
          --label "project" \
          --body "## Daily Project Assessment — ${DATE}

        **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        Repo-wide tech-debt / stale-doc / config-drift sweep. No runtime
        metrics snapshot in this role anymore — see
        \`.github/AGENT-FLOWS-REDESIGN.md\` §6.3; runtime anomaly detection
        is the future \`monitor\` role's job (Phase 2, not yet built).")

        ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -Eo '[0-9]+$')
        if [ -z "$ISSUE_NUMBER" ]; then
          echo "ERROR: Failed to parse issue number from: $ISSUE_URL"
          exit 1
        fi
        echo "Created issue #${ISSUE_NUMBER}"
        echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Load agent prompt
      run: |
        {
          PROMPT_DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
          echo "AGENT_PROMPT<<${PROMPT_DELIM}"
          cat .github/prompts/project.md
          echo "${PROMPT_DELIM}"
        } >> "$GITHUB_ENV"

    - name: Run project agent
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        responses-api-endpoint: ${{ secrets.AZURE_OPENAI_BASE_URL }}
        model: gpt-5-mini
        sandbox: workspace-write
        safety-strategy: drop-sudo
        effort: medium
        codex-home: ${{ github.workspace }}/.github/codex
        prompt: |
          <instructions>
          ${{ env.AGENT_PROMPT }}
          </instructions>

          You have been triggered for the daily project assessment — repo-wide, covering every bot in `.github/bots.yml` (VahterBanBot, CouponHubBot, AlitaBot).
          When a finding is specific to one bot's source directory, add its `bot:<name>` label (e.g. `bot:vahter`) in addition to `project`. Shared-infra findings (BotInfra, tests, CI) need no bot label.
          The orchestration issue is #${{ steps.create-issue.outputs.issue_number }}.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Guards against run 30241204433 (2026-07-27): every step exited 0, the
    # orchestration issue was created and auto-closed, but the agent never
    # made its required `gh issue comment` summary call — a silent no-op
    # that is indistinguishable from a genuine clean day. See
    # .github/AGENT-FLOWS-REDESIGN.md §1. This step only asserts PRESENCE of
    # an agent-authored comment, never its content — a legitimate clean-day
    # summary must still pass.
    - name: Assert agent posted a summary
      id: assert-agent-output
      if: always() && steps.create-issue.outputs.issue_number
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        COMMENTS_JSON=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json comments)
        # The agent posts its summary through the same GH_TOKEN identity as
        # this workflow's own automated comments (cleanup's stale-issue
        # auto-close, the "Close orchestration issue" step below, and this
        # step's own recorded-silence comment), so comment author cannot
        # distinguish "agent" from "workflow" here -- only the fixed
        # boilerplate text of the workflow's own comments can. Anything that
        # does not match one of those known prefixes must have come from
        # the agent.
        AGENT_COMMENTS=$(echo "$COMMENTS_JSON" | jq '[.comments[] | select(
          ((.body | startswith("Orchestration issue auto-closed")) or
           (.body | startswith("**Auto-closed by cleanup.**")) or
           (.body | startswith("**Agent produced no summary.**"))) | not
        )]')
        COUNT=$(echo "$AGENT_COMMENTS" | jq 'length')
        if [ "$COUNT" -gt 0 ]; then
          echo "PASS: agent posted $COUNT non-workflow comment(s) on orchestration issue #$ISSUE_NUMBER."
          echo "agent_posted=true" >> "$GITHUB_OUTPUT"
        else
          echo "FAIL: agent produced no summary comment on orchestration issue #$ISSUE_NUMBER."
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "**Agent produced no summary.** The project agent's run finished without posting the required summary comment (see \`.github/prompts/project.md\`: \"Your final tool call should always be the \`gh issue comment\` that posts the summary\"). Recording this run as a failure, not a clean day. Workflow run: ${RUN_URL}"
          echo "agent_posted=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Close orchestration issue
      if: always() && steps.create-issue.outputs.issue_number
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue close "${{ steps.create-issue.outputs.issue_number }}" --repo "${{ github.repository }}" \
          --comment "Orchestration issue auto-closed after agent run. See workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    # Placed AFTER the close step (rather than exiting 1 directly in the
    # assert step above) so the orchestration issue is always closed
    # regardless of outcome -- a failed run must not leave the issue open
    # for the next cleanup job to also complain about. `if: always()` makes
    # this run even if an earlier step in the job failed outright.
    - name: Fail run if agent produced no summary
      if: always() && steps.create-issue.outputs.issue_number
      env:
        AGENT_POSTED: ${{ steps.assert-agent-output.outputs.agent_posted }}
      run: |
        set -euo pipefail
        if [ "$AGENT_POSTED" != "true" ]; then
          echo "::error::Project agent produced no summary comment this run -- see the recorded-silence comment on the orchestration issue. Failing the run so a silent no-op is never indistinguishable from a green clean-day run."
          exit 1
        fi
        echo "Agent posted a summary comment -- run considered successful."
