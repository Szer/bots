name: "Coupon: Deploy"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/BotInfra/**'
      - '!src/BotInfra/**/*.md'
      - 'src/CouponHubBot/**'
      - '!src/CouponHubBot/**/*.md'
      - 'src/coupon-hub-bot/**'
      - '!src/coupon-hub-bot/**/*.md'
      - 'src/Dockerfile.bot'
      - 'tests/CouponHubBot.Tests/**'
      - 'tests/CouponHubBot.Ocr.Tests/**'
      - 'tests/BotTestInfra/**'
      - 'tests/FakeTgApi/**'
      - 'tests/FakeAzureOcrApi/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  # contents: write (not read) because this workflow calls _bot-deploy.yml,
  # which calls _sre-agent.yml on failure. A called reusable workflow cannot
  # escalate beyond its caller's permissions, and the SRE agent needs to push
  # a branch for a one-liner mitigation PR. With contents: read the whole run
  # fails at load time with a jobless startup_failure (2026-07-26).
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write
  # actions: read is for the aks-vpn turnstile step in _bot-deploy.yml, which
  # polls `gh api .../actions/runs` for other bots' in-flight deploys.
  actions: read

jobs:
  deploy:
    uses: ./.github/workflows/_bot-deploy.yml
    with:
      test-command: |
        dotnet test tests/CouponHubBot.Tests/CouponHubBot.Tests.fsproj -c Release --logger "trx;LogFileName=test-results.trx"
        dotnet test tests/CouponHubBot.Ocr.Tests/CouponHubBot.Ocr.Tests.fsproj -c Release --logger "trx;LogFileName=test-results.trx"
      migrations-path: src/coupon-hub-bot/migrations
      db-name: coupon_hub_bot
      docker-image: ghcr.io/szer/coupon-bot
      bot-project: CouponHubBot
      argocd-app-name: coupon-bot
      container-name: coupon-bot
    secrets:
      # Dedicated single-occupancy peer (Szer/my-infra#111) — do not point
      # this back at the shared WIREGUARD_CONFIG secret; concurrent bot
      # deploys over one peer flap the WG endpoint (issue #368).
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG_COUPON }}
      DB_PROD_HOST: ${{ secrets.DB_PROD_HOST }}
      DB_PROD_USERNAME: ${{ secrets.DB_PROD_USERNAME }}
      DB_PROD_PASSWORD: ${{ secrets.DB_PROD_PASSWORD }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
