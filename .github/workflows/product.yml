name: Product Analysis

# Loops over every bot whose `roles` (.github/bots.yml) include `product` —
# currently vahter and coupon; alita is deliberately excluded (13 messages
# ever, see AGENT-FLOWS-REDESIGN.md §3.8). Gather/probe/guard/labeling are
# fully bots.yml-driven via a bash loop (add a bot = one bots.yml entry).
#
# Three-job graph (see monitor.yml for the identical pattern, driven by the
# same drop-sudo bug):
#   gather   — VPN-bound (aks-vpn concurrency group, single-occupancy):
#              product-data gathering + the per-bot guard. Uploads
#              /tmp/evidence as a short-lived artifact (7-day retention — it
#              contains user chat text) and emits `clean_bots`, a JSON array
#              of bots that passed the guard (suitable for `fromJson`).
#   agent    — one job PER BOT via `strategy.matrix: bot: fromJson(clean_bots)`,
#              `fail-fast: false`, NOT in the aks-vpn group. Each matrix leg
#              is its own runner, so each gets exactly ONE
#              `openai/codex-action@v1` invocation: `safety-strategy:
#              drop-sudo` is a one-way, once-per-runner operation, and a
#              SECOND invocation on the same runner dies at
#              `ensurePasswordlessSudo` — the same bug fixed in monitor.yml
#              (before the split, only the first bot in the old single job
#              ever got analysed). Creates + closes the per-bot orchestration
#              issue around the agent invocation. Skipped entirely (guarded
#              by `if:`) when `clean_bots` is `[]`, since GitHub errors on an
#              empty matrix.
#   finalize — `if: always()`; fails the run if the gather job reports any
#              skipped bot OR if any `agent` matrix leg failed, but not
#              merely because `agent` itself was skipped (empty matrix).
#
# The guard step evaluates EACH bot's manifest INDEPENDENTLY — one bot's
# outage must never blind an unrelated healthy bot. A degraded bot is
# skipped (its agent leg never runs, and the shared
# evidence-pipeline-degraded issue records exactly which bot and which
# source), while every other bot's agent still runs normally.
#
# Adding a THIRD product bot is now purely a `.github/bots.yml` entry with
# `product` in its `roles` — no workflow edit needed.

on:
  schedule:
    - cron: '15 10 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Close stale product orchestration issues
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue list \
          --repo "${{ github.repository }}" \
          --label "product" \
          --state open \
          --json number,title \
          --jq '.[] | select(.title | test("Product analysis.*\\d{4}-\\d{2}-\\d{2}"; "i")) | .number' \
        | while read -r NUM; do
          echo "Closing stale product orchestration issue #${NUM}"
          gh issue close "$NUM" --repo "${{ github.repository }}" \
            --comment "**Auto-closed by cleanup.** Product agent did not close this issue in time." \
            || echo "WARNING: Failed to close orchestration issue #${NUM}, continuing"
        done

  gather:
    needs: cleanup
    runs-on: ubuntu-latest
    # VPN peer is single-occupancy; concurrent connections break DNS (2026-07-23
    # incident). Only THIS job touches the VPN.
    concurrency:
      group: aks-vpn
      cancel-in-progress: false

    outputs:
      clean_bots: ${{ steps.guard.outputs.clean_bots }}
      skipped_bots: ${{ steps.guard.outputs.skipped_bots }}

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client
      run: sudo apt-get install -y postgresql-client

    - name: Ensure bot:<name> labels exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        source scripts/gather/lib.sh
        for bot in $(bots_yml_json | jq -r '.bots | keys[]'); do
          gh label create "bot:${bot}" --repo "${{ github.repository }}" --color "1d76db" \
            --description "Findings for the ${bot} bot" --force
        done

    - name: Setup WireGuard VPN
      run: |
        chmod +x scripts/setup-vpn.sh
        ./scripts/setup-vpn.sh
      env:
        WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        # DB_PROD_HOST is a public endpoint reachable only via the VPN peer's
        # firewall allowlist (same as _bot-deploy.yml's migration step) — split
        # tunnel (10.0.0.0/8 only) leaves it unreachable and every psql query
        # times out. This silently produced 21 consecutive empty product
        # reports (2026-05-15 → 2026-07-25); scripts/gather/product.sh aborts
        # loudly on query failure, but it still needs the full tunnel to work.
        SPLIT_TUNNEL: "false"

    - name: Gather product data (bash loop, not matrix — single VPN session)
      id: gather
      run: |
        set -euo pipefail
        source scripts/gather/lib.sh
        chmod +x scripts/gather/product.sh
        mkdir -p /tmp/evidence
        BOTS="$(all_bots_with_role product)"
        {
          echo "bots<<BOTS_EOF"
          echo "$BOTS"
          echo "BOTS_EOF"
        } >> "$GITHUB_OUTPUT"
        for bot in $BOTS; do
          echo "::group::gather product evidence for ${bot}"
          if ./scripts/gather/product.sh "$bot" > "/tmp/evidence/${bot}.md"; then
            echo "gather OK for ${bot}"
          else
            echo "WARNING: gather failed for ${bot} — whatever manifest/partial report it printed before failing is in /tmp/evidence/${bot}.md; continuing to gather remaining bots so the guard step sees the full picture"
          fi
          echo "::endgroup::"
        done
      env:
        PROMETHEUS_URL: http://prometheus.internal:9090
        LOKI_URL: http://loki.internal
        DB_PROD_HOST: ${{ secrets.DB_PROD_HOST }}
        DB_PROD_USERNAME: ${{ secrets.DB_PROD_USERNAME }}
        DB_PROD_PASSWORD: ${{ secrets.DB_PROD_PASSWORD }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Full-tunnel VPN (SPLIT_TUNNEL=false above) routes ALL traffic — including
    # api.github.com and the Azure OpenAI endpoint — through the VPN peer,
    # which times out on non-AKS-internal public traffic (see scripts/setup-vpn.sh).
    # Disconnect as soon as the DB/Prometheus-dependent step is done so the
    # remaining gh/Codex API calls use normal internet routing again.
    - name: Disconnect VPN (post gather)
      run: sudo wg-quick down wg0 || true

    - name: Guard — evaluate each bot's evidence independently
      id: guard
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GATHER_BOTS: ${{ steps.gather.outputs.bots }}
      run: |
        set -euo pipefail
        chmod +x scripts/report-degraded.sh
        SKIPPED=""
        declare -a CLEAN_BOTS=()
        for bot in $GATHER_BOTS; do
          FILE="/tmp/evidence/${bot}.md"
          MANIFEST=$(head -n1 "$FILE" 2>/dev/null || echo '')
          # An unreadable manifest must count as DEGRADED, never as clean.
          # Previously a malformed line made jq fail, `|| true` swallowed it,
          # BAD came back empty, and the guard waved a blind bot through as
          # healthy — the exact failure class this guard exists to prevent
          # (2026-07-27 incident: emit_manifest pretty-printed, so `head -n1`
          # returned a bare "{").
          if ! echo "$MANIFEST" | jq -e 'type == "object" and has("sources")' >/dev/null 2>&1; then
            MANIFEST=$(jq -cn --arg b "$bot" \
              '{bot: $b, sources: {manifest: "unreadable — gatherer emitted no valid manifest line"}}')
            BAD="manifest"
          else
            BAD=$(echo "$MANIFEST" | jq -r '.sources | to_entries[] | select(.value != "ok") | .key')
          fi
          echo "$MANIFEST" > "/tmp/evidence/${bot}.manifest.json"
          if [ -n "$BAD" ]; then
            echo "::error::unreachable sources for bot=${bot}: ${BAD} — SKIPPING only ${bot}'s agent invocation this run; other bots are evaluated independently and are unaffected."
            ./scripts/report-degraded.sh "/tmp/evidence/${bot}.manifest.json"
            echo "run_${bot}=false" >> "$GITHUB_OUTPUT"
            SKIPPED="${SKIPPED}${SKIPPED:+, }${bot} (${BAD})"
          else
            echo "bot=${bot}: evidence clean — proceeding to agent invocation."
            echo "run_${bot}=true" >> "$GITHUB_OUTPUT"
            CLEAN_BOTS+=("$bot")
          fi
        done
        echo "skipped_bots=${SKIPPED}" >> "$GITHUB_OUTPUT"
        # JSON array of bots that passed the guard, suitable for the `agent`
        # job's `fromJson(...)` matrix. jq's --args/$ARGS.positional handles
        # the zero-bots case correctly (emits `[]`), unlike naive string
        # concatenation.
        CLEAN_JSON=$(jq -cn --args '$ARGS.positional' "${CLEAN_BOTS[@]}")
        echo "clean_bots=${CLEAN_JSON}" >> "$GITHUB_OUTPUT"
        if [ -n "$SKIPPED" ]; then
          echo "::warning::Evidence pipeline degraded for: ${SKIPPED} — see the evidence-pipeline-degraded issue. Healthy bots below still run normally; this run will still end non-zero overall (see the 'finalize' job) so the degradation isn't silently swallowed."
        else
          echo "All gathered bots reported a clean manifest."
        fi

    - name: Upload evidence artifact for the agent job
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: product-evidence
        path: /tmp/evidence
        # Contains user chat text (product report excerpts) — do not keep it
        # around beyond what the agent job needs it for.
        retention-days: 7

    - name: Disconnect VPN (final safety net)
      if: always()
      run: sudo wg-quick down wg0 || true

  # ─── agent — one job per bot that passed the guard, so each runner gets
  # exactly ONE openai/codex-action@v1 invocation (see the header comment's
  # "agent" bullet for the drop-sudo bug this fixes). ──────────────────────

  agent:
    needs: gather
    # GitHub errors outright on an empty strategy.matrix — this guard is
    # mandatory, not optional, whenever clean_bots could legitimately be `[]`
    # (e.g. every bot degraded this run).
    if: needs.gather.outputs.clean_bots != '[]' && needs.gather.outputs.clean_bots != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJson(needs.gather.outputs.clean_bots) }}

    steps:
    - uses: actions/checkout@v4

    - name: Download evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: product-evidence
        path: /tmp/evidence

    - name: "Load agent prompt and product data"
      id: load
      run: |
        set -euo pipefail
        source scripts/gather/lib.sh
        BOT="${{ matrix.bot }}"
        DISPLAY_NAME="$(bot_field "$BOT" '.display_name')"
        echo "display_name=${DISPLAY_NAME}" >> "$GITHUB_OUTPUT"
        {
          PROMPT_DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
          echo "AGENT_PROMPT<<${PROMPT_DELIM}"
          cat .github/prompts/product.md
          echo "${PROMPT_DELIM}"
        } >> "$GITHUB_ENV"
        {
          REPORT_DELIM="REPORT_EOF_$(openssl rand -hex 16)"
          echo "PRODUCT_REPORT<<${REPORT_DELIM}"
          cat "/tmp/evidence/${BOT}.md"
          echo "${REPORT_DELIM}"
        } >> "$GITHUB_ENV"

    - name: "Create orchestration issue"
      id: create-issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        BOT="${{ matrix.bot }}"
        DISPLAY_NAME="${{ steps.load.outputs.display_name }}"
        DATE=$(date -u +%Y-%m-%d)
        REPORT=$(cat "/tmp/evidence/${BOT}.md")

        ISSUE_URL=$(gh issue create --repo "${{ github.repository }}" \
          --title "Product analysis: ${DISPLAY_NAME} ${DATE}" \
          --label "product" --label "bot:${BOT}" \
          --body "## Product Analysis — ${DISPLAY_NAME} — ${DATE}

        **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        ---

        ${REPORT}")

        ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -Eo '[0-9]+$')
        if [ -z "$ISSUE_NUMBER" ]; then
          echo "ERROR: Failed to parse issue number from: $ISSUE_URL"
          exit 1
        fi
        echo "Created issue #${ISSUE_NUMBER}"
        echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: "Run product agent"
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ secrets.AZURE_OPENAI_API_KEY }}
        responses-api-endpoint: ${{ secrets.AZURE_OPENAI_BASE_URL }}
        model: gpt-5-mini
        sandbox: workspace-write
        safety-strategy: drop-sudo
        effort: medium
        codex-args: '--config sandbox_workspace_write.network_access=true'
        prompt: |
          <instructions>
          ${{ env.AGENT_PROMPT }}
          </instructions>

          <bot registry-key="${{ matrix.bot }}">${{ steps.load.outputs.display_name }}</bot>

          <product-data-report>
          ${{ env.PRODUCT_REPORT }}
          </product-data-report>

          You have been triggered for the scheduled product analysis (runs Tuesday and Friday), for ${{ steps.load.outputs.display_name }} only.
          Every issue you create must carry the label `bot:${{ matrix.bot }}` in addition to any other labels required by your instructions.
          The orchestration issue is #${{ steps.create-issue.outputs.issue_number }}.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "Close orchestration issue"
      if: always() && steps.create-issue.outputs.issue_number
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue close "${{ steps.create-issue.outputs.issue_number }}" --repo "${{ github.repository }}" \
          --comment "Orchestration issue auto-closed after agent run. See workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ─── finalize — surfaces both failure modes (degraded evidence pipeline,
  # and any bot's agent invocation failing) without depending on `agent`
  # having actually run (an empty matrix is a legitimate, non-failing
  # skip). ──────────────────────────────────────────────────────────────

  finalize:
    needs: [gather, agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail the run if any bot's evidence was degraded or any bot's agent failed
      env:
        SKIPPED_BOTS: ${{ needs.gather.outputs.skipped_bots }}
        AGENT_RESULT: ${{ needs.agent.result }}
      run: |
        set -euo pipefail
        FAILED="false"
        if [ -n "$SKIPPED_BOTS" ]; then
          echo "::error::Evidence pipeline degraded for: ${SKIPPED_BOTS} — see the evidence-pipeline-degraded issue. Any other bot's agent still ran normally; this job ends non-zero only to surface the degradation, not to undo the healthy bots' analysis."
          FAILED="true"
        fi
        # AGENT_RESULT is "skipped" (not "failure") when clean_bots was `[]` —
        # that must NOT fail this job, only an actual matrix-leg failure should.
        if [ "$AGENT_RESULT" = "failure" ]; then
          echo "::error::One or more bot agent invocations failed this run (see the 'agent' job's matrix legs)."
          FAILED="true"
        fi
        if [ "$FAILED" = "true" ]; then
          exit 1
        fi
        echo "No bots skipped and no agent failures this run — evidence pipeline + agent invocations healthy."
