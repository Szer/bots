name: "Alita: Deploy"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/BotInfra/**'
      - 'src/AlitaBot/**'
      - 'src/alita-bot/**'
      - 'src/Dockerfile.bot'
      - 'tests/AlitaBot.Tests/**'
      - '.github/workflows/alita-deploy.yml'
  workflow_dispatch:

permissions:
  # contents: write (not read) because this workflow calls _bot-deploy.yml,
  # which calls _sre-agent.yml on failure. A called reusable workflow cannot
  # escalate beyond its caller's permissions, and the SRE agent needs to push
  # a branch for a one-liner mitigation PR. With contents: read the whole run
  # fails at load time with a jobless startup_failure (2026-07-26).
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_bot-deploy.yml
    with:
      test-command: |
        dotnet test tests/AlitaBot.Tests/AlitaBot.Tests.fsproj -c Release --logger "trx;LogFileName=test-results.trx"
      migrations-path: src/alita-bot/migrations
      db-name: alita_bot
      docker-image: ghcr.io/szer/alita-bot
      bot-project: AlitaBot
      argocd-app-name: alita-bot
      container-name: alita-bot
      # TODO: flip to true (or drop the override) once alita-bot has shipped
      # to prod and settled — SRE coverage (deploy-failure issue -> SRE agent)
      # is "automatic for every bot on _bot-deploy.yml" per AGENTS.md, but a
      # brand-new bot's first deploys are exactly when a human should be
      # reading verify-deploy.sh output directly, not routing it to an agent
      # that has no track record with this bot yet.
      # 2026-07-27: flipped false -> true. The caution above was right while
      # AlitaBot was brand-new; it has now run in prod since 2026-07-22 and
      # settled. Leaving it false meant AlitaBot was silently the ONE bot with
      # no SRE coverage, while `.github/prompts/sre.md` simultaneously claimed
      # "every bot in this monorepo opts into SRE coverage by default,
      # including future ones" — documentation asserting the opposite of
      # configuration. Found by the 2026-07-27 SRE drill, which failed a real
      # prod deploy and got no agent response because of this line.
      sre-enabled: true
    secrets:
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
      DB_PROD_HOST: ${{ secrets.DB_PROD_HOST }}
      DB_PROD_USERNAME: ${{ secrets.DB_PROD_USERNAME }}
      DB_PROD_PASSWORD: ${{ secrets.DB_PROD_PASSWORD }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
