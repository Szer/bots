name: Retry Probe (temporary)

# TEMPORARY end-to-end test fixture for agent-retry.yml (#489). Removed in the
# follow-up PR once the retry chain has been observed working on main.

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: recover
        options:
          - recover
          - timeout-both
        description: recover = attempt 1 times out, attempt 2 succeeds; timeout-both = every attempt times out

jobs:
  leg:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Time out on attempt 1 (and on every attempt in timeout-both mode)
      env:
        MODE: ${{ inputs.mode }}
        ATTEMPT: ${{ github.run_attempt }}
      run: |
        echo "mode=${MODE} attempt=${ATTEMPT}"
        if [ "$ATTEMPT" = "1" ] || [ "$MODE" = "timeout-both" ]; then
          echo "sleeping past timeout-minutes on purpose"
          sleep 300
        fi
        echo "attempt ${ATTEMPT} succeeded"

  finalize:
    needs: leg
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail the run unless the leg succeeded (mirrors monitor.yml finalize)
      env:
        LEG_RESULT: ${{ needs.leg.result }}
      run: |
        echo "leg result: ${LEG_RESULT}"
        [ "$LEG_RESULT" = "success" ] || exit 1
