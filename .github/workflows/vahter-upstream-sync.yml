name: "Vahter: Upstream Sync"

# Syncs VahterBanBot source to fsharplang-ru/vahter-bot via pull request.
# The upstream repo is a read-only mirror for community visibility.
# Deploy happens exclusively from this monorepo.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/BotInfra/**'
      - '!src/BotInfra/**/*.md'
      - 'src/VahterBanBot/**'
      - '!src/VahterBanBot/**/*.md'
      - 'src/vahter-bot/**'
      - '!src/vahter-bot/**/*.md'
      - 'src/Dockerfile.bot'
      - 'tests/VahterBanBot.Tests/**'
      - 'tests/VahterBanBot.Unit.Tests/**'
      - 'tests/SerializationCompat.Tests/**'
      - 'tests/BotTestInfra/**'
      - 'tests/FakeTgApi/**'
      - 'tests/FakeAzureOcrApi/**'
      - 'tests/Dockerfile.fake'
      - 'tests/Directory.Build.targets'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'LICENSE'
      - '.github/workflows/_bot-build.yml'
      - '.github/upstream/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout monorepo
      uses: actions/checkout@v4
      with:
        path: monorepo

    - name: Checkout upstream
      uses: actions/checkout@v4
      with:
        repository: fsharplang-ru/vahter-bot
        token: ${{ secrets.VAHTER_UPSTREAM_TOKEN }}
        path: upstream

    - name: Replace upstream content
      run: |
        set -euo pipefail
        cd upstream

        # Remove everything except .git
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
        mkdir -p src tests .github/workflows

        # ── Source code ──
        cp -r ../monorepo/src/BotInfra src/BotInfra
        cp -r ../monorepo/src/VahterBanBot src/VahterBanBot
        cp -r ../monorepo/src/vahter-bot src/vahter-bot
        cp ../monorepo/src/Dockerfile.bot src/

        # ── Tests ──
        # Every vahter-relevant suite, so the mirror is independently testable:
        # integration (Testcontainers), unit, and serialization-compat.
        cp -r ../monorepo/tests/BotTestInfra tests/BotTestInfra
        cp -r ../monorepo/tests/VahterBanBot.Tests tests/VahterBanBot.Tests
        cp -r ../monorepo/tests/VahterBanBot.Unit.Tests tests/VahterBanBot.Unit.Tests
        cp -r ../monorepo/tests/SerializationCompat.Tests tests/SerializationCompat.Tests
        cp -r ../monorepo/tests/FakeTgApi tests/FakeTgApi
        cp -r ../monorepo/tests/FakeAzureOcrApi tests/FakeAzureOcrApi
        cp ../monorepo/tests/Dockerfile.fake tests/
        cp ../monorepo/tests/Directory.Build.targets tests/

        # ── Build infrastructure ──
        cp ../monorepo/Directory.Build.props .
        cp ../monorepo/Directory.Packages.props .
        cp ../monorepo/global.json .
        cp ../monorepo/.gitignore .
        cp ../monorepo/LICENSE .
        cp ../monorepo/.github/upstream/README.md README.md

        # ── CI (build only — deploy lives in the monorepo) ──
        # build.yml is a tracked file under .github/upstream/, not a heredoc:
        # it gets actionlint coverage and its indentation can't be corrupted in
        # transit. See the comment at the top of .github/upstream/build.yml.
        mkdir -p .github/workflows
        cp ../monorepo/.github/workflows/_bot-build.yml .github/workflows/
        cp ../monorepo/.github/upstream/build.yml .github/workflows/build.yml

        # ── Solution file ──
        # `dotnet new sln` emits .slnx on .NET 10 and .sln on older SDKs; match
        # either. Testcontainers' CommonDirectoryPath.GetSolutionDirectory()
        # (which the integration suite uses to locate the Dockerfiles and the
        # migrations directory) resolves both.
        dotnet new sln --name vahter-ban-bot --force
        SLN=$(find . -maxdepth 1 -name 'vahter-ban-bot.sln*' -print -quit)
        if [ -z "$SLN" ]; then
          echo "::error::dotnet new sln produced no vahter-ban-bot.sln/.slnx file"
          exit 1
        fi
        dotnet sln "$SLN" add \
          src/BotInfra/BotInfra.fsproj \
          src/VahterBanBot/VahterBanBot.fsproj \
          tests/BotTestInfra/BotTestInfra.fsproj \
          tests/VahterBanBot.Tests/VahterBanBot.Tests.fsproj \
          tests/VahterBanBot.Unit.Tests/VahterBanBot.Unit.Tests.fsproj \
          tests/SerializationCompat.Tests/SerializationCompat.Tests.fsproj \
          tests/FakeTgApi/FakeTgApi.fsproj \
          tests/FakeAzureOcrApi/FakeAzureOcrApi.fsproj

        # ── Sanity check: the generated CI workflow must be parseable ──
        # This is the failure that went unnoticed for months — an unparseable
        # workflow yields a jobless startup_failure on the mirror with no error
        # surfaced in the API, so fail the sync here instead.
        python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' \
          .github/workflows/build.yml
        python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' \
          .github/workflows/_bot-build.yml

    - name: Create pull request
      run: |
        cd upstream
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A

        if git diff --cached --quiet; then
          echo "No changes to sync"
          exit 0
        fi

        BRANCH="sync/monorepo-${GITHUB_SHA:0:7}"
        git checkout -b "$BRANCH"
        git commit -m "Sync from monorepo (${GITHUB_SHA:0:7})"
        git push origin "$BRANCH"

        NEW_PR_URL=$(gh pr create \
          --repo fsharplang-ru/vahter-bot \
          --base main \
          --head "$BRANCH" \
          --title "Sync from monorepo (${GITHUB_SHA:0:7})" \
          --body "Automated sync from monorepo commit ${GITHUB_SHA}.")
        echo "Created: $NEW_PR_URL"

        # Close previous sync PRs (keep only the new one).
        # Note: gh's --head flag requires an exact branch name, so filter by prefix in jq.
        gh pr list \
          --repo fsharplang-ru/vahter-bot \
          --state open \
          --limit 100 \
          --json number,headRefName \
          --jq ".[] | select(.headRefName | startswith(\"sync/monorepo-\")) | select(.headRefName != \"$BRANCH\") | .number" \
        | while read -r old_pr; do
            echo "Closing old sync PR #${old_pr}"
            gh pr close "$old_pr" \
              --repo fsharplang-ru/vahter-bot \
              --delete-branch \
              --comment "Superseded by ${NEW_PR_URL}"
          done
      env:
        GH_TOKEN: ${{ secrets.VAHTER_UPSTREAM_TOKEN }}
