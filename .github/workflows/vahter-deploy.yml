name: "Vahter: Deploy"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/BotInfra/**'
      - '!src/BotInfra/**/*.md'
      - 'src/VahterBanBot/**'
      - '!src/VahterBanBot/**/*.md'
      - 'src/vahter-bot/**'
      - '!src/vahter-bot/**/*.md'
      - 'src/Dockerfile.bot'
      - 'tests/VahterBanBot.Tests/**'
      - 'tests/VahterBanBot.Unit.Tests/**'
      - 'tests/SerializationCompat.Tests/**'
      - 'tests/BotTestInfra/**'
      - 'tests/FakeTgApi/**'
      - 'tests/FakeAzureOcrApi/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  # contents: write (not read) because this workflow calls _bot-deploy.yml,
  # which calls _sre-agent.yml on failure. A called reusable workflow cannot
  # escalate beyond its caller's permissions, and the SRE agent needs to push
  # a branch for a one-liner mitigation PR. With contents: read the whole run
  # fails at load time with a jobless startup_failure (2026-07-26).
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write
  # actions: read is for the aks-vpn turnstile step in _bot-deploy.yml, which
  # polls `gh api .../actions/runs` for other bots' in-flight deploys.
  actions: read

jobs:
  deploy:
    uses: ./.github/workflows/_bot-deploy.yml
    with:
      test-command: >-
        dotnet test tests/VahterBanBot.Unit.Tests/VahterBanBot.Unit.Tests.fsproj
        -c Release --logger "trx;LogFileName=unit-test-results.trx"
        --logger "console;verbosity=detailed" &&
        dotnet test tests/SerializationCompat.Tests/SerializationCompat.Tests.fsproj
        -c Release --logger "trx;LogFileName=compat-test-results.trx"
        --logger "console;verbosity=detailed" &&
        dotnet test tests/VahterBanBot.Tests/VahterBanBot.Tests.fsproj
        -c Release --logger "trx;LogFileName=test-results.trx"
        --logger "console;verbosity=detailed"
      migrations-path: src/vahter-bot/migrations
      db-name: vahter_db_v2
      docker-image: ghcr.io/szer/vahter-bot
      bot-project: VahterBanBot
      argocd-app-name: vahter-bot
      container-name: vahter-bot
    secrets:
      WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
      DB_PROD_HOST: ${{ secrets.DB_PROD_HOST }}
      DB_PROD_USERNAME: ${{ secrets.DB_PROD_USERNAME }}
      DB_PROD_PASSWORD: ${{ secrets.DB_PROD_PASSWORD }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}

  # Mirror the deployed code to fsharplang-ru/vahter-bot. Gated on `deploy` so
  # the community mirror only ever receives code that actually reached prod.
  # The sync opens a PR, enables auto-merge, and exits — it does NOT wait for
  # the mirror's build (vahter-mirror-reconcile.yml alarms on stuck PRs instead).
  sync-mirror:
    needs: [ deploy ]
    uses: ./.github/workflows/vahter-upstream-sync.yml
    secrets:
      VAHTER_UPSTREAM_TOKEN: ${{ secrets.VAHTER_UPSTREAM_TOKEN }}
