name: "Bot: Deploy"

on:
  workflow_call:
    inputs:
      test-command:
        required: true
        type: string
      migrations-path:
        required: true
        type: string
        description: "Path to migrations dir relative to repo root"
      db-name:
        required: true
        type: string
        description: "Database name for Flyway migrations (e.g. vahter_db)"
      docker-image:
        required: true
        type: string
        description: "Full GHCR image name (e.g. ghcr.io/org/bot)"
      bot-project:
        required: true
        type: string
        description: "BOT_PROJECT build arg (e.g. VahterBanBot)"
      argocd-app-name:
        required: true
        type: string
      container-name:
        required: true
        type: string
      readiness-grace-period:
        type: string
        default: "180"
      sre-enabled:
        type: boolean
        default: true
        description: "Open a deploy-failure issue (wakes the SRE agent) when verify-deploy fails"
    secrets:
      WIREGUARD_CONFIG:
        required: true
      DB_PROD_HOST:
        required: true
      DB_PROD_USERNAME:
        required: true
      DB_PROD_PASSWORD:
        required: true
      ARGOCD_AUTH_TOKEN:
        required: true
      AZURE_OPENAI_API_KEY:
        required: true
        description: "For the SRE agent (_sre-agent.yml), invoked on deploy/verify failure"
      AZURE_OPENAI_BASE_URL:
        required: true
        description: "For the SRE agent (_sre-agent.yml), invoked on deploy/verify failure"

env:
  DOCKER_IMAGE: flyway/flyway
  SCHEMAS: public
  # Display names of every workflow that shares the VPN turnstile below.
  # Keep in sync with the `name:` at the top of coupon-deploy.yml /
  # vahter-deploy.yml / alita-deploy.yml.
  DEPLOY_WORKFLOW_NAMES: "Coupon: Deploy,Vahter: Deploy,Alita: Deploy"

jobs:
  deploy:
    runs-on: ubuntu-22.04-arm
    # VPN peer is single-occupancy; concurrent connections break DNS (2026-07-23
    # incident). This group is now scoped per caller workflow (aks-vpn-<name>)
    # instead of a single shared "aks-vpn": duplicate runs of the SAME bot still
    # serialize/dedupe here, but different bots no longer fight over one shared
    # group. They used to — GitHub concurrency groups hold only one PENDING job,
    # so a fan-out of all three bots' deploys canceled the older waiter(s)
    # instead of queuing them (silently leaving those bots on stale images).
    # Cross-bot serialization for the VPN itself is now handled explicitly by
    # the "Wait for aks-vpn turnstile" step below, which polls and queues
    # (never cancels) until this run is the oldest one waiting.
    concurrency:
      group: aks-vpn-${{ github.workflow }}
      cancel-in-progress: false

    steps:
    - name: Wait for aks-vpn turnstile
      id: turnstile
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        TIMEOUT_SECONDS=1800
        START_TS=$(date +%s)
        IFS=',' read -r -a DEPLOY_WORKFLOWS <<< "${DEPLOY_WORKFLOW_NAMES}"

        while true; do
          WAITERS=()
          for STATUS in queued in_progress; do
            for WF in "${DEPLOY_WORKFLOWS[@]}"; do
              while IFS=$'\t' read -r CREATED ID; do
                [ -n "$ID" ] && WAITERS+=("${CREATED}"$'\t'"${ID}")
              done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=${STATUS}&per_page=100" \
                --jq ".workflow_runs[] | select(.name==\"${WF}\") | \"\(.created_at)\t\(.id)\"")
            done
          done

          # Oldest by created_at wins; run id is only a tie-breaker. A single
          # push can fan out to all three deploy workflows within the same
          # second (real 2026-08-12 data: three runs shared one created_at
          # value), so created_at alone isn't unique. created_at is the
          # primary key (not run id) because a rerun of an old, still-waiting
          # run gets a fresh created_at but keeps its original (low) run id —
          # ordering by run id would let that rerun cut ahead of every run
          # that arrived while it sat broken; ordering by created_at makes it
          # re-queue fairly at the back, like a new arrival.
          OLDEST_LINE=""
          if [ "${#WAITERS[@]}" -gt 0 ]; then
            OLDEST_LINE=$(printf '%s\n' "${WAITERS[@]}" | sort -k1,1 -k2,2n | head -n1)
          fi
          OLDEST_ID=$(printf '%s' "$OLDEST_LINE" | awk -F'\t' '{print $2}')

          if [ -z "$OLDEST_ID" ]; then
            echo "::warning::aks-vpn turnstile saw no queued/in_progress deploy runs, not even this one — proceeding"
            break
          fi
          if [ "$OLDEST_ID" = "$RUN_ID" ]; then
            echo "aks-vpn turnstile: this run (${RUN_ID}) is the oldest waiter — proceeding"
            break
          fi

          ELAPSED=$(( $(date +%s) - START_TS ))
          if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
            echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for the aks-vpn turnstile — run ${OLDEST_ID} is still ahead of this run (${RUN_ID}). The VPN peer is single-occupancy; rerun this job once that deploy finishes."
            exit 1
          fi

          SLEEP=$(( 20 + RANDOM % 11 ))
          echo "aks-vpn turnstile: waiting — oldest queued/in_progress deploy run is ${OLDEST_ID}, this run is ${RUN_ID}. Sleeping ${SLEEP}s (elapsed ${ELAPSED}s/${TIMEOUT_SECONDS}s)."
          sleep "$SLEEP"
        done

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Tests
      run: ${{ inputs.test-command }}

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/*.trx"
      if: ${{ always() }}

    - name: Upload container logs
      uses: actions/upload-artifact@v4
      with:
        name: container-logs
        path: test-artifacts/
      if: ${{ always() }}

    - name: Setup WireGuard VPN
      run: |
        chmod +x scripts/setup-vpn.sh
        ./scripts/setup-vpn.sh
      env:
        WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        SPLIT_TUNNEL: "false"

    - name: Apply migrations to production DB
      run: >-
        docker run --rm
        --network host
        --volume ${{ github.workspace }}/${{ inputs.migrations-path }}:/flyway/sql:ro
        --volume ${{ github.workspace }}/reports:/flyway/reports
        "${{ env.DOCKER_IMAGE }}"
        -url="jdbc:postgresql://${{ secrets.DB_PROD_HOST }}/${{ inputs.db-name }}"
        -user="${{ secrets.DB_PROD_USERNAME }}"
        -password="${{ secrets.DB_PROD_PASSWORD }}"
        migrate -schemas="${{ env.SCHEMAS }}"

    - name: Disconnect VPN
      run: sudo wg-quick down wg0 || true

    - name: Upload Flyway report
      uses: actions/upload-artifact@v4
      with:
        name: Database Report
        path: reports/

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push to GHCR
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ inputs.docker-image }}:${{ github.sha }}, ${{ inputs.docker-image }}:latest
        file: ./src/Dockerfile.bot
        build-args: BOT_PROJECT=${{ inputs.bot-project }}
        platforms: linux/arm64

  verify-deploy:
    needs: deploy
    runs-on: ubuntu-22.04-arm
    # Same per-caller group as the deploy job, for same-bot dedupe only — no
    # turnstile needed here. Other runs' turnstiles wait on this whole RUN
    # (github.run_id) being queued/in_progress, and a run stays in_progress
    # across all of its jobs, not just deploy — so no other bot's deploy can
    # start between this run's deploy and verify-deploy. (The old shared
    # "aks-vpn" group had a real gap here: its lock released the moment this
    # run's deploy job finished, letting another run's deploy jump in before
    # verify-deploy grabbed the VPN again. Keying the turnstile off run status
    # instead of a per-job lock closes that gap.)
    concurrency:
      group: aks-vpn-${{ github.workflow }}
      cancel-in-progress: false
    outputs:
      # infra|app|unknown — set by verify-deploy.sh even when the step fails
      # (GITHUB_OUTPUT is captured regardless of the step's exit code), so
      # downstream jobs know which class of failure this was without parsing logs.
      failure-class: ${{ steps.verify.outputs.failure-class }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup WireGuard VPN
      run: |
        chmod +x scripts/setup-vpn.sh
        ./scripts/setup-vpn.sh
      env:
        WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}

    - name: Verify deployment
      id: verify
      run: |
        chmod +x scripts/verify-deploy.sh
        ./scripts/verify-deploy.sh
      env:
        ARGOCD_URL: http://argo.internal
        LOKI_URL: http://loki.internal
        PROMETHEUS_URL: http://prometheus.internal:9090
        EXPECTED_IMAGE_TAG: ${{ github.sha }}
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        ARGOCD_APP_NAME: ${{ inputs.argocd-app-name }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        READINESS_GRACE_PERIOD: ${{ inputs.readiness-grace-period }}

    - name: Disconnect VPN
      if: always()
      run: sudo wg-quick down wg0 || true

  notify-failure:
    needs: [deploy, verify-deploy]
    if: ${{ failure() && inputs.sre-enabled }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue-number: ${{ steps.create-issue.outputs.issue-number }}
    steps:
    - name: Create deploy-failure issue
      id: create-issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FAILURE_CLASS: ${{ needs.verify-deploy.outputs.failure-class }}
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        FAILURE_CLASS="${FAILURE_CLASS:-unknown}"
        LABELS=(--label "deploy-failure")
        if [ "$FAILURE_CLASS" = "infra" ]; then
          LABELS+=(--label "infra")
        fi
        ISSUE_URL=$(gh issue create \
          --repo "$GITHUB_REPOSITORY" \
          --title "Deploy failure: ${{ inputs.argocd-app-name }} (${SHORT_SHA})" \
          "${LABELS[@]}" \
          --body "## Deploy Failure

        **Bot:** ${{ inputs.argocd-app-name }}
        **ArgoCD app:** ${{ inputs.argocd-app-name }}
        **Container label:** ${{ inputs.container-name }}
        **GHCR image:** ${{ inputs.docker-image }}
        **Commit:** ${{ github.sha }}
        **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        **Failure class:** ${FAILURE_CLASS}

        Follow the runbook in \`.github/prompts/sre.md\`. Identify which \`verify-deploy.sh\` phase failed from the run logs above.")
        echo "Created: ${ISSUE_URL}"
        echo "issue-number=${ISSUE_URL##*/}" >> "$GITHUB_OUTPUT"

  sre:
    # Reusable-workflow call, not a plain job — this is the fix for the SRE
    # agent never running (see .github/AGENT-FLOWS-REDESIGN.md §1.1/§3.5):
    # sre.yml used to trigger on `issues: [labeled]`, but the deploy-failure
    # issue above is created with secrets.GITHUB_TOKEN, and GitHub Actions
    # does not trigger workflows from events authored by the default
    # GITHUB_TOKEN (anti-recursion) — so that trigger fired zero times, ever.
    # Calling the reusable workflow directly from this same failed run sidesteps
    # the whole problem: no token games, no label propagation to depend on.
    needs: [deploy, verify-deploy, notify-failure]
    if: ${{ failure() && inputs.sre-enabled }}
    uses: ./.github/workflows/_sre-agent.yml
    with:
      bot: ${{ inputs.bot-project }}
      argocd-app-name: ${{ inputs.argocd-app-name }}
      container-name: ${{ inputs.container-name }}
      docker-image: ${{ inputs.docker-image }}
      commit: ${{ github.sha }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      issue-number: ${{ needs.notify-failure.outputs.issue-number }}
      failure-class: ${{ needs.verify-deploy.outputs.failure-class }}
    secrets: inherit
