name: "Fizruk: Deploy"

# Fizruk has no database, so unlike the other bots it skips _bot-deploy.yml
# (Flyway, WireGuard, Loki/Prometheus verification) and just tests + pushes.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/BotInfra/**'
      - '!src/BotInfra/**/*.md'
      - 'src/Fizruk/**'
      - '!src/Fizruk/**/*.md'
      - 'src/Dockerfile.bot'
      - 'tests/Fizruk.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Tests
      run: dotnet test tests/Fizruk.Tests/Fizruk.Tests.fsproj -c Release --logger "trx;LogFileName=test-results.trx"

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/*.trx"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push to GHCR
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ghcr.io/szer/fizruk:${{ github.sha }}, ghcr.io/szer/fizruk:latest
        file: ./src/Dockerfile.bot
        build-args: BOT_PROJECT=Fizruk
        platforms: linux/arm64
