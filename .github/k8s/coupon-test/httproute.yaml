---
# Routes coupon-test.szer.dev (a coupon-test-https listener on the shared
# main-gateway, to be provisioned persistently by a my-infra PR — the
# CouponHubBot analogue of alita-test's my-infra PR #83/#84 — see the
# "Known blocker" section of the CouponHubBot real-test contract) to the
# transient bot Service. Applied/torn down every run alongside the rest of
# this directory.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coupon-test-route
  namespace: coupon-test
  labels:
    coupon-ci: transient
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
  hostnames:
  - "coupon-test.szer.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: coupon-bot
      port: 5000
